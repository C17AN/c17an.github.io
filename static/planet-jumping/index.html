<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090807">
  <meta name="description" content="Planet Jumping — an immersive journey from Mars to Earth and Venus.">
  <link rel="icon" href="data:,">
  <title>Planet Jumping — An Interplanetary Journey</title>
  <style>
    @font-face{font-family:'SF Pro';src:local('SF Pro Display'),local('SF Pro Text');font-weight:400}
    @font-face{font-family:'SF Pro';src:local('SF Pro Display Bold'),local('SF Pro Text Bold');font-weight:700}
    @font-face{font-family:'SF Pro Thin';src:local('SF Pro Display Thin'),local('SF Pro Thin');font-weight:100}
    @font-face{font-family:'Aalto';src:local('Aalto'),local('Arial Narrow');font-weight:400}
    :root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    html,body,button,a,.portal{cursor:none!important}
    button,a{-webkit-tap-highlight-color:transparent}
    button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:4px}
    .experience{position:relative;width:100%;height:100%;height:100dvh;min-height:540px;overflow:hidden;background:#0a0908}
    .backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
    .background{object-fit:cover;opacity:0;transition:opacity .8s ease}
    .background.is-visible{opacity:1}
    .hevc-fallback .backgrounds::after{content:'';position:absolute;inset:0;background-image:var(--fallback-mars);background-size:cover;background-position:center;animation:fallback-drift 18s ease-in-out infinite alternate;transition:opacity .8s ease}
    .hevc-fallback[data-planet="earth"] .backgrounds::after{opacity:0}
    .hevc-fallback[data-planet="venus"] .backgrounds::after{background-image:var(--fallback-venus)}
    @keyframes fallback-drift{to{transform:scale(1.07)}}
    .shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
    .chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
    .experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}
    .header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
    .header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
    .nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
    .nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1;font-size:14px}
    .nav a.active{background:#fff;color:#000}
    .menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer;font:700 14px 'SF Pro',Arial,sans-serif}
    .menu-panel{position:absolute;z-index:10;top:80px;right:clamp(18px,1.95vw,28px);width:min(340px,calc(100vw - 36px));padding:24px;border:1px solid rgba(255,255,255,.35);border-radius:18px;background:rgba(12,13,17,.87);backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .menu-panel[hidden]{display:none}
    .menu-panel-top{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
    .menu-close{border:0;background:transparent;color:#fff;font-size:25px;line-height:1;cursor:pointer}
    .menu-panel p{margin:24px 0;line-height:1.65;font-size:15px;color:#d4d4d4}
    .menu-route{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .menu-route span{opacity:.55}
    .menu-panel>a{display:inline-block;margin-top:22px;color:#fff;font-size:14px;text-decoration:underline;text-underline-offset:5px}
    .planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
    .planet-item{display:flex;align-items:center;min-height:20px;color:rgba(255,255,255,.75)}
    .planet-item.active{font-size:18px;font-weight:700;gap:8px;color:#fff}
    .planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff;flex:none}
    .portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
    .portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
    .portal-heading strong{font-size:18px;margin-left:8px}
    .portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
    .portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
    .portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
    .planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
    .planet-content h1{font-family:Aalto,'Arial Narrow',sans-serif;font-stretch:condensed;font-size:clamp(128px,21.8vw,314px);font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px) scaleX(.64);transform-origin:left bottom;opacity:0;white-space:nowrap;min-width:0;flex:1}
    .planet-content dl{width:min(447px,34vw);margin:0;font-size:16px;flex:none}
    .fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
    .fact:last-child{border-bottom:0}
    .fact dt{font-weight:700}
    .fact dd{margin:0;line-height:1.35}
    .transition-layer{display:none}
    .scene-canvas{display:none}
    .loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s;white-space:nowrap}
    .experience.is-loading .loading{opacity:.8}
    .experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
    .experience.is-transitioning .shade{opacity:1}
    .experience.is-committing .background{transition:none!important}
    .preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden;transition:opacity .35s ease}
    .preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .hevc-fallback .preloader video{opacity:0}
    .hevc-fallback .preloader::before{content:'';position:absolute;inset:0;background-image:var(--fallback-approach);background-size:cover;background-position:center;animation:fallback-approach 3s ease-in-out both}
    @keyframes fallback-approach{from{transform:scale(1);filter:brightness(.7)}to{transform:scale(1.18);filter:brightness(1.12)}}
    .preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
    .preloader.is-background{z-index:0;opacity:0;pointer-events:none}
    .preloader.is-background .preloader-shade{opacity:0}
    .floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);will-change:left,top,width,height,transform;transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
    .floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
    .floating-logo.is-settled{z-index:5}
    .preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
    .preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
    .preloader-count .percent{font-size:24px;padding-bottom:4px}
    .preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
    @keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
    body:not(.preload-complete) .custom-cursor{opacity:0!important}
    .custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease;will-change:transform}
    .custom-cursor.is-visible{opacity:1}
    .cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
    .cursor-dot{width:12px;height:12px;background:#fff}
    .cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
    .custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
    .cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
    .custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}
    body:not(.intro-ready) .header,body:not(.intro-ready) .planet-list,body:not(.intro-ready) .planet-content h1,body:not(.intro-ready) .planet-content .fact{opacity:0}
    .intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
    .intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
    .content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
    .content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
    .content-revealing .fact:nth-child(1){animation-delay:.52s}
    .content-revealing .fact:nth-child(2){animation-delay:.68s}
    .content-revealing .fact:nth-child(3){animation-delay:.84s}
    .content-revealing .fact:nth-child(4){animation-delay:1s}
    .mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
    .planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
    .planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
    .planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
    .planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
    .planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
    .planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
    .planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
    .planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
    .planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
    .planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}
    @keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
    @keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
    @keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(-32px,42px) scaleX(.64)}to{opacity:1;filter:blur(0);transform:translate(-32px,0) scaleX(.64)}}
    @keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
    @keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
    @keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
    @media(max-width:900px){
      .nav{display:none}
      .portal-wrap{width:min(300px,48vw)}
      .planet-content h1{font-size:clamp(105px,24vw,190px)}
      .planet-content dl{width:43vw}
      .fact{grid-template-columns:110px 1fr}
      .planet-list{font-size:14px}
      .planet-item.active{font-size:16px}
    }
    @media(max-width:640px){
      .experience{min-height:600px}
      .planet-list{display:none}
      .portal-wrap{top:44%;width:min(260px,66vw)}
      .planet-content{left:18px;right:18px;bottom:18px;display:block}
      .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
      .planet-content dl{width:100%;font-size:13px}
      .fact{grid-template-columns:92px 1fr;padding:5px 0}
      .portal-heading{font-size:14px}
      .portal-heading strong{font-size:16px}
      .menu{height:38px}
      .portal{border-radius:70px}
      .preloader-count>span:first-child{font-size:52px}
    }
    @media(hover:none),(pointer:coarse){html,body,button,a,.portal{cursor:auto!important}.custom-cursor{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
  </style>
</head>
<body>
  <main class="experience" data-planet="mars">
    <div class="backgrounds" aria-hidden="true">
      <video id="mars-background" class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" crossorigin="anonymous" muted playsinline preload="auto"></video>
      <video id="earth-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" crossorigin="anonymous" muted playsinline preload="auto"></video>
      <video id="venus-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" crossorigin="anonymous" muted playsinline preload="auto"></video>
    </div>
    <div class="preloader" id="preloader" aria-label="Loading Mars">
      <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" crossorigin="anonymous" muted playsinline preload="auto"></video>
      <div class="preloader-shade"></div>
    </div>
    <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural">
    <div class="preloader-count" id="preloader-count" aria-live="polite"><span id="preloader-value">0</span><span class="percent">%</span></div>
    <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <header class="header chrome">
      <div class="header-actions">
        <nav class="nav" aria-label="Primary navigation"><a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a></nav>
        <button class="menu" type="button" aria-expanded="false" aria-controls="menu-panel">Menu</button>
      </div>
    </header>
    <aside class="menu-panel" id="menu-panel" aria-label="Journey menu" hidden>
      <div class="menu-panel-top"><span>Planet Jumping / Mission</span><button class="menu-close" type="button" aria-label="Close menu">×</button></div>
      <p>Step through the portal to travel from Mars to Earth and Venus. Each destination reveals a new view and a few facts about the planet.</p>
      <div class="menu-route">Mars <span>→</span> Earth <span>→</span> Venus</div>
      <a href="/projects">Back to the project archive ↗</a>
    </aside>
    <aside class="planet-list chrome" aria-label="Planets"></aside>
    <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
    <section class="portal-wrap chrome" aria-label="Next destination">
      <div class="portal-heading"><span>Next:</span><span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span></div>
      <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
        <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" crossorigin="anonymous" muted playsinline preload="auto"></video>
        <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" crossorigin="anonymous" alt="Mercury">
      </button>
    </section>
    <section class="planet-content chrome" aria-live="polite"><h1 id="planet-title">MARS</h1><dl id="facts"></dl></section>
    <div class="transition-layer" aria-hidden="true"><video id="transition-video" crossorigin="anonymous" muted playsinline preload="auto"></video></div>
    <div class="loading" aria-hidden="true">Preparing orbit…</div>
    <div class="custom-cursor" aria-hidden="true"><span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span></div>
  </main>
  <script>
    (()=>{
      'use strict';
      const BASE='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
      const TO_EARTH=BASE+'/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';

      }
      function project(x,y,cx,cy,rx,ry){
        const ax=rx*Math.PI/180,ay=ry*Math.PI/180;
        const xx=x*Math.cos(ay),yy=y*Math.cos(ax),z=x*Math.sin(ay)-y*Math.sin(ax);
        const p=850/(850+z);return[cx+xx*p,cy+yy*p];
      }
      function draw(now){
        const dt=Math.min(40,now-previousFrame||16);previousFrame=now;
        rotX+=(targetX-rotX)*Math.min(1,dt*.009);
        rotY+=(targetY-rotY)*Math.min(1,dt*.009);
        ctx.clearRect(0,0,innerWidth,innerHeight);
        if(frozen){ctx.drawImage(sceneCanvas,0,0,innerWidth,innerHeight);drawShade(ctx)}
        const rect=portal.getBoundingClientRect(),e=expansion;
        const cx=rect.left+rect.width/2+(innerWidth/2-rect.left-rect.width/2)*e;
        const cy=rect.top+rect.height/2+(innerHeight/2-rect.top-rect.height/2)*e;
        const baseW=rect.width+(innerWidth-rect.width)*e,baseH=rect.height+(innerHeight-rect.height)*e;
        const scale=e?1:maskScale,w=baseW*scale,h=baseH*scale;
        const r=90*(1-e)*scale,rx=rotX*(1-e),ry=rotY*(1-e);
        if(w>1&&h>1){
          const points=roundedPoints(w,h,r);
          ctx.save();ctx.globalAlpha=canvasOpacity;ctx.beginPath();
          points.forEach(([x,y],i)=>{const [sx,sy]=project(x,y,cx,cy,rx,ry);i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy)});
          ctx.closePath();ctx.clip();ctx.fillStyle='#030303';ctx.fillRect(0,0,innerWidth,innerHeight);
          drawCover(ctx,transitionActive?transitionSource():portalSource());
          if(transitionActive)drawShade(ctx);
          ctx.restore();
        }
        requestAnimationFrame(draw);
      }
      function cursorLoop(){
        cursorX+=(cursorTargetX-cursorX)*.2;cursorY+=(cursorTargetY-cursorY)*.2;
        cursor.style.transform=`translate3d(${cursorX}px,${cursorY}px,0)`;
        requestAnimationFrame(cursorLoop);
      }
      const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      function animateValue(setter,duration){
        if(reducedMotion){setter(1);return Promise.resolve()}
        return new Promise(resolve=>{
          const start=performance.now();
          function step(now){const t=Math.min(1,(now-start)/duration);setter(ease(t));t<1?requestAnimationFrame(step):resolve()}
          requestAnimationFrame(step);
        });
      }
      const nextFrame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
      function waitForMedia(media,timeout=2500){
        if(media.tagName==='IMG')return media.complete&&media.naturalWidth?Promise.resolve():new Promise(resolve=>{
          const timer=setTimeout(done,timeout);
          function done(){clearTimeout(timer);media.removeEventListener('load',done);media.removeEventListener('error',done);resolve()}
          media.addEventListener('load',done,{once:true});media.addEventListener('error',done,{once:true});
        });
        if(media.readyState>=2)return Promise.resolve();
        return new Promise(resolve=>{
          const timer=setTimeout(done,timeout);
          function done(){clearTimeout(timer);media.removeEventListener('loadeddata',done);media.removeEventListener('canplaythrough',done);media.removeEventListener('error',done);resolve()}
          media.addEventListener('loadeddata',done,{once:true});media.addEventListener('canplaythrough',done,{once:true});media.addEventListener('error',done,{once:true});
        });
      }
      function revealMask(){
        experience.classList.remove('mask-revealing');void experience.offsetWidth;experience.classList.add('mask-revealing');
        maskScale=0;return animateValue(v=>maskScale=v,1050);
      }
      function revealPlanetContent(){
        experience.classList.remove('content-revealing');void experience.offsetWidth;experience.classList.add('content-revealing');
      }
      async function startExperience(){
        started=true;render();
        await waitForMedia(portalSource(),4000);
        await revealMask();
        document.body.classList.add('intro-ready');
        setTimeout(revealPlanetContent,850);
      }
      function runPreloader(){
        let finished=false,countFrame=0;
        function tick(){
          if(finished)return;
          const ratio=preloaderVideo.duration?preloaderVideo.currentTime/preloaderVideo.duration:0;
          $('#preloader-value').textContent=String(Math.min(99,Math.round(ratio*100)));
          countFrame=requestAnimationFrame(tick);
        }
        function finish(){
          if(finished)return;finished=true;cancelAnimationFrame(countFrame);clearTimeout(fallback);
          $('#preloader-value').textContent='100';
          $('#preloader-count').classList.add('is-leaving');
          $('#floating-logo').classList.add('is-docked');
          $('#preloader').classList.add('is-background');
          document.body.classList.add('preload-complete');
          startExperience().catch(()=>{document.body.classList.add('intro-ready');maskScale=1;revealPlanetContent()});
          setTimeout(()=>$('#preloader-count').remove(),750);
          setTimeout(()=>$('#floating-logo').classList.add('is-settled'),2000);
        }
        const fallback=setTimeout(finish,9000);
        async function play(){
          if(finished)return;
          preloaderVideo.playbackRate=Math.max(.25,preloaderVideo.duration/3);
          preloaderVideo.currentTime=0;
          preloaderVideo.addEventListener('ended',finish,{once:true});
          try{await preloaderVideo.play();tick()}catch{finish()}
        }
        if(preloaderVideo.readyState>=1)play();
        else{preloaderVideo.addEventListener('loadedmetadata',play,{once:true});preloaderVideo.addEventListener('error',finish,{once:true})}
      }
      async function travel(){
        if(busy||current==='venus')return;
        closeMenu();
        busy=true;targetX=0;targetY=0;
        const next=current==='mars'?'earth':'venus';
        try{
          transitionVideo.src=states[current].portal;transitionVideo.load();
          experience.classList.add('is-loading');
          await waitForMedia(transitionVideo,1600);
          experience.classList.remove('is-loading','content-revealing','mask-revealing');
          experience.classList.add('is-transitioning');
          transitionVideo.currentTime=0;transitionVideo.playbackRate=1.3;
          canvasOpacity=1;transitionActive=true;
          const ended=new Promise((resolve,reject)=>{
            transitionVideo.addEventListener('ended',resolve,{once:true});
            transitionVideo.addEventListener('error',reject,{once:true});
            setTimeout(resolve,20000);
          });
          await transitionVideo.play();
          await animateValue(v=>expansion=v,1100);
          await ended;
          sceneCtx.clearRect(0,0,innerWidth,innerHeight);
          drawCover(sceneCtx,transitionSource());frozen=true;
          current=next;experience.classList.add('is-committing');render();
          await nextFrame();await nextFrame();
          transitionActive=false;expansion=0;maskScale=0;canvasOpacity=1;
          experience.classList.remove('is-transitioning','is-committing');
          await waitForMedia(portalSource(),2500);
          const maskReveal=revealMask();setTimeout(revealPlanetContent,100);
          await maskReveal;
          frozen=false;
          setTimeout(()=>{transitionVideo.removeAttribute('src');transitionVideo.load();busy=false},450);
        }catch{
          transitionActive=false;expansion=0;maskScale=1;canvasOpacity=1;frozen=false;
          experience.classList.remove('is-loading','is-transitioning','is-committing');
          busy=false;
        }
      }
      document.addEventListener('pointermove',event=>{
        if(event.pointerType==='touch')return;
        cursorTargetX=event.clientX;cursorTargetY=event.clientY;
        cursor.classList.add('is-visible');
        if(!busy){targetY=(event.clientX/innerWidth-.5)*37.4;targetX=(event.clientY/innerHeight-.5)*-33}
      });
      document.addEventListener('pointerleave',()=>{targetX=targetY=0;cursor.classList.remove('is-visible')});
      portal.addEventListener('pointerenter',()=>cursor.classList.add('is-enter'));
      portal.addEventListener('pointerleave',()=>{cursor.classList.remove('is-enter');targetX=targetY=0});
      portal.addEventListener('click',travel);
      function closeMenu(){menuPanel.hidden=true;menuButton.setAttribute('aria-expanded','false')}
      function openMenu(){menuPanel.hidden=false;menuButton.setAttribute('aria-expanded','true')}
      menuButton.addEventListener('click',()=>menuPanel.hidden?openMenu():closeMenu());
      $('.menu-close').addEventListener('click',closeMenu);
      document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu()});
      for(const link of document.querySelectorAll('.nav a'))link.addEventListener('click',event=>{
        event.preventDefault();
        if(link.getAttribute('href')==='#explore'){closeMenu();portal.focus()}
        else openMenu();
      });
      window.addEventListener('resize',resizeCanvas);
      for(const background of document.querySelectorAll('.background')){background.pause();background.currentTime=0;background.loop=true}
      portalVideo.loop=true;
      resizeCanvas();render();requestAnimationFrame(draw);requestAnimationFrame(cursorLoop);runPreloader();
    })();
  </script>
</body>
</html>
